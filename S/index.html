<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频解析工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080c18;
            padding: 60px 20px;
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .title-text {
            font-size: 22px;
            color: #d4af37;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 1px;
        }

        /* 流光输入框容器 */
        .input-container {
            position: relative;
            width: min(800px, 100%);
            height: 90px;
            background: transparent;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        /* 滚动流光渐变边框 */
        .gradient-border {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            padding: 4px;
            background: linear-gradient(
                90deg,
                #00f0ff,
                #29b6f6,
                #7c4dff,
                #00e5ff,
                #29b6f6
            );
            background-size: 300% 100%;
            animation: flowBorder 4s linear infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        @keyframes flowBorder {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 300% 50%;
            }
        }

        .styled-input {
            width: 100%;
            height: 90px;
            background: transparent !important;
            border: none !important;
            outline: none !important;
            color: #d4af37;
            font-size: 22px;
            font-weight: 500;
            text-align: center;
            line-height: 90px;
            border-radius: 999px;
            caret-color: #d4af37;
            padding: 0 20px;
        }

        .styled-input::placeholder {
            color: #b8b0c0;
            opacity: 1;
            text-align: center;
        }

        .btn-wrap {
            display: flex;
            gap: 16px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 32px;
            font-size: 16px;
            border-radius: 999px;
            border: 2px solid #29b6f6;
            background: transparent;
            color: #00f0ff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(41, 182, 246, 0.15);
            box-shadow: 0 0 15px #00f0ff55;
        }

        #result {
            width: min(800px, 100%);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #29b6f655;
            background: rgba(20, 28, 48, 0.6);
            color: #eee;
            word-break: break-all;
            line-height: 1.8;
            /* 默认隐藏 */
            display: none;
        }

        #result a {
            color: #00f0ff;
            text-decoration: none;
        }

        #result a:hover {
            text-decoration: underline;
        }

        #result button {
            margin-top: 12px;
            padding: 8px 18px;
            border-radius: 6px;
            border: 1px solid #7c4dff;
            background: transparent;
            color: #7c4dff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="title-text">仅供个人学习使用,严禁任何商业用途</div>

    <div class="input-container">
        <div class="gradient-border"></div>
        <!-- 重点改动：删除value，改为placeholder -->
        <input id="videoUrl" class="styled-input" placeholder="此处粘贴要观看的视频地址即可">
    </div>

    <div class="btn-wrap">
        <button class="btn" onclick="genParseUrl()">生成解析地址</button>
        <button class="btn" onclick="clearLog()">清空结果</button>
    </div>

    <div id="result"></div>

<script>
(function () {
    const videoParseList = [
        {"name": "虾米视频解析", "url": "https://jx.xmflv.com/?url="}
    ];

    let currentIndex = 0;
    let successCounts = {};

    function loadCounts() {
        const str = localStorage.getItem('vipParser_successCounts');
        if(str) try{ successCounts = JSON.parse(str); }catch(e){ successCounts={} }
    }
    function saveCounts() {
        localStorage.setItem('vipParser_successCounts', JSON.stringify(successCounts));
    }
    loadCounts();

    function getBestParser() {
        return {idx:0, item:videoParseList[0]};
    }

    window.markSuccess = function(){
        successCounts[currentIndex] = (successCounts[currentIndex]||0)+1;
        saveCounts();
        alert("已记录当前接口解析成功");
    }

    window.vipParser = { getBestParser };
})();

function genParseUrl(){
    let val = document.getElementById('videoUrl').value.trim();
    if(!val){ alert("请输入视频链接"); return; }
    let res = vipParser.getBestParser();
    let fullUrl = res.item.url + encodeURIComponent(val);
    let resultBox = document.getElementById('result');
    resultBox.innerHTML = `
        <strong style="color:#00f0ff">当前解析源：${res.item.name}</strong><br>
        完整播放地址：<a href="${fullUrl}" target="_blank">${fullUrl}</a><br><br>
        <button onclick="markSuccess()">标记该接口可用</button>
    `;
    // 显示结果框
    resultBox.style.display = 'block';
}
function clearLog(){
    let resultBox = document.getElementById('result');
    resultBox.innerHTML = "";
    // 清空后隐藏结果框
    resultBox.style.display = 'none';
}
</script>
</body>
</html>
